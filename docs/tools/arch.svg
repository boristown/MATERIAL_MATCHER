<text x="820" y="275" font-size="24" font-weight="bold" fill="#375623" text-anchor="middle">应用服务（二选一）</text>
<text x="820" y="315" font-size="20" fill="#333333" text-anchor="middle">Docker Compose（推荐）｜ systemd 源码安装</text>
<rect x="540" y="380" width="270" height="110" rx="10" fill="#DDEBF7"/>
<text x="675" y="425" font-size="22" font-weight="bold" fill="#1F4E79" text-anchor="middle">Web 服务</text>
<text x="675" y="460" font-size="18" fill="#333333" text-anchor="middle">FastAPI + Vue3</text>
<rect x="830" y="380" width="270" height="110" rx="10" fill="#DDEBF7"/>
<text x="965" y="425" font-size="22" font-weight="bold" fill="#1F4E79" text-anchor="middle">匹配引擎</text>
<text x="965" y="460" font-size="18" fill="#333333" text-anchor="middle">后台 Worker · 有界并发</text>
<rect x="540" y="520" width="270" height="110" rx="10" fill="#FFF2CC"/>
<text x="675" y="565" font-size="22" font-weight="bold" fill="#7F5F00" text-anchor="middle">本地语义模型</text>
<text x="675" y="600" font-size="18" fill="#333333" text-anchor="middle">BGE-base · ONNX 量化</text>
<rect x="830" y="520" width="270" height="110" rx="10" fill="#FFF2CC"/>
<text x="965" y="565" font-size="22" font-weight="bold" fill="#7F5F00" text-anchor="middle">SQLite 元数据库</text>
<text x="965" y="600" font-size="18" fill="#333333" text-anchor="middle">方案 / 任务 / 结果 / 审计</text>
<text x="820" y="700" font-size="20" fill="#C00000" text-anchor="middle" font-weight="bold">全程零外网依赖 · 无云端调用 · 材料数据不出域</text>
<rect x="1210" y="240" width="330" height="300" rx="16" fill="#ffffff" stroke="#2E75B6" stroke-width="3"/>
<text x="1375" y="300" font-size="28" font-weight="bold" fill="#1F4E79" text-anchor="middle">业务人员</text>
<rect x="1250" y="340" width="250" height="56" rx="8" fill="#DDEBF7"/><text x="1375" y="376" font-size="20" fill="#1F4E79" text-anchor="middle">浏览器直接使用</text>
<rect x="1250" y="410" width="250" height="56" rx="8" fill="#DDEBF7"/><text x="1375" y="446" font-size="20" fill="#1F4E79" text-anchor="middle">无需安装客户端</text>
<line x1="1140" y1="390" x2="1210" y2="390" stroke="#1F4E79" stroke-width="5" marker-end="url(#a)"/>
<text x="800" y="840" font-size="22" fill="#666666" text-anchor="middle">介质一次拷贝上机 → 一键安装 → 浏览器访问；升级用增量包（自动备份 / 预检 / 回滚）</text>
</svg>