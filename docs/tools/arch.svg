<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<rect width="1600" height="900" fill="#f4f6fa"/>
<text x="800" y="70" font-size="40" font-weight="bold" fill="#1F4E79" text-anchor="middle">离线内网部署架构</text>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1F4E79"/></marker></defs>
<rect x="60" y="180" width="330" height="420" rx="16" fill="#ffffff" stroke="#2E75B6" stroke-width="3"/>
<text x="225" y="235" font-size="28" font-weight="bold" fill="#1F4E79" text-anchor="middle">离线交付介质</text>
<text x="225" y="290" font-size="22" fill="#333333" text-anchor="middle">DVD / U 盘</text>
<rect x="100" y="330" width="250" height="56" rx="8" fill="#DDEBF7"/><text x="225" y="366" font-size="20" fill="#1F4E79" text-anchor="middle">Docker 镜像 + 模型</text>
<rect x="100" y="400" width="250" height="56" rx="8" fill="#DDEBF7"/><text x="225" y="436" font-size="20" fill="#1F4E79" text-anchor="middle">Native 安装包</text>
<rect x="100" y="470" width="250" height="56" rx="8" fill="#DDEBF7"/><text x="225" y="506" font-size="20" fill="#1F4E79" text-anchor="middle">增量升级包 / 回滚</text>
<line x1="390" y1="390" x2="490" y2="390" stroke="#1F4E79" stroke-width="5" marker-end="url(#a)"/>
<rect x="500" y="140" width="640" height="620" rx="16" fill="#ffffff" stroke="#548235" stroke-width="3"/>
<text x="820" y="195" font-size="28" font-weight="bold" fill="#375623" text-anchor="middle">客户内网服务器（数据不出内网）</text>
