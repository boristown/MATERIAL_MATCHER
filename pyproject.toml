[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "material-matcher"
version = "1.3.2"
description = "Configurable material group-code matching engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1","uvicorn>=0.30,<1","pydantic>=2.8,<3","openpyxl>=3.1,<4","python-multipart>=0.0.12,<1","numpy>=1.26,<3"]
[project.optional-dependencies]
embedding = ["onnxruntime>=1.18,<2", "tokenizers>=0.20,<1"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
[project.scripts]
material-matcher = "material_matcher.cli:main"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
