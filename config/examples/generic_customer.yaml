profile:
  name: generic_customer
  version: 1
  extends: ../../profiles/base.yaml

source:
  adapter: excel
  path: ./input/source.xlsx
  options:
    sheet: SAP导出
    header_row: 2
    trim_headers: true
    empty_values: ["", "NULL", "N/A", "-"]

target:
  adapter: excel
  path: ./input/target.xlsx
  options:
    sheet: 集团码
    header_row: 1
    trim_headers: true

column_resolution:
  mode: ordered
  strategies: [exact, case_insensitive, normalized, alias, regex]

logical_fields:
  source_id:
    type: string
    source:
      aliases: [MATNR, 物料编码, 物料号]
      required: true
  description:
    type: text
    source:
      aliases: [MAKTX, 物料描述, 物料名称]
    target:
      aliases: [集团物料名称, 物料名称, ZNAME]
  model:
    type: text
    source:
      aliases: [型号, 规格型号, ZXHGG]
    target:
      aliases: [集团型号, 规格, ZXHGG]
  manufacturer:
    type: text
    source:
      aliases: [厂家, 制造商, 品牌, HERST]
    target:
      aliases: [厂家, 制造商, 品牌]
  material_group:
    type: string
    source:
      aliases: [MATKL, 物料组]
    target:
      aliases: [MATKL, 集团物料组]
  group_code:
    type: string
    target:
      aliases: [集团码, ZJTM]
      required: true

derived_fields:
  identity_text:
    expression:
      op: concat
      fields: [description, model, manufacturer]
      separator: " "
      skip_empty: true

normalization:
  default_pipeline:
    - trim
    - normalize_width
    - collapse_spaces
    - normalize_punctuation
  fields:
    manufacturer:
      - trim
      - normalize_width
      - dictionary: manufacturer_aliases

dictionaries:
  synonyms: ./dict/synonyms.yaml
  manufacturer_aliases: ./dict/manufacturers.yaml
  units: ./dict/units.yaml

retrieval:
  backend: auto_bbq
  top_k: 200
  batch_size: 256

group_matching:
  default:
    mode: global
  routes:
    - when:
        source.material_group: [STRICT_GROUP]
      mode: strict
      source_field: material_group
      target_field: material_group
    - when:
        source.material_group: [MAPPED_GROUP]
      mode: mapped
      target_groups: [G01, G02]

match_rules:
  - id: identity_semantic
    source_fields: [identity_text]
    target_fields: [description, model, manufacturer]
    compose:
      source: concat
      target: concat
      separator: " "
    method: semantic
    weight: 0.45

  - id: model_rule
    source_fields: [model]
    target_fields: [model]
    method: hybrid
    weight: 0.35

  - id: manufacturer_rule
    source_fields: [manufacturer]
    target_fields: [manufacturer]
    method: normalized_exact
    weight: 0.20

scoring:
  missing_field_strategy: dynamic_weight

rule_sets:
  default:
    weights:
      identity_semantic: 0.45
      model_rule: 0.35
      manufacturer_rule: 0.20
  high_precision_group:
    when:
      source.material_group: [IC, ELECTRONIC_CORE]
    weights:
      identity_semantic: 0.30
      model_rule: 0.50
      manufacturer_rule: 0.20

decision:
  mode: routed
  default:
    matched_if: gt
    success_threshold: 0.86
  routes:
    - when:
        source.material_group: [IC, ELECTRONIC_CORE]
      success_threshold: 0.93
    - when:
        source.material_group: [STANDARD_PART]
      success_threshold: 0.80

score_display:
  method: linear
  scale: 100
  coefficient: 1.0
  offset: 0.0
  clamp: [0, 100]

output:
  format: xlsx
  top_n: 5
  sheets:
    matched:
      name: 匹配结果
      columns:
        - source.source_id
        - source.description
        - decision.status
        - target.group_code
        - scores.final_raw_score
        - scores.display_score
    candidates:
      name: TopN
      long_format: true
      columns:
        - source.source_id
        - rank
        - target.group_code
        - scores.final_raw_score
  aliases:
    source.source_id: 客户物料号
    source.description: 客户物料描述
    target.group_code: 集团码
    scores.display_score: 相似度
