name: ci

on:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - name: Verify canonical package version
        run: python -c "from importlib.metadata import version; import material_matcher; assert material_matcher.__version__ == version('material-matcher') == open('src/material_matcher/VERSION', encoding='utf-8').read().strip()"
      - name: Build wheel from canonical version
        run: python -m pip wheel . --no-deps --no-build-isolation -w /tmp/material-matcher-wheel
      - run: pytest -q
      - name: Real-world matching quality (scan baseline)
        run: python scripts/evaluate_matching_quality.py
      - name: Real-world field score diagnostics
        run: python scripts/diagnose_matching_scores.py
      - run: python -m compileall -q src
      - run: bash -n installer/install.sh
      - run: python scripts/check_repo_files.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build
