name: ci

on:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Issue 162 before/after retrieval comparison (temporary PR run)
        run: |
          python scripts/benchmark_issue_162.py --source-rows 1000 --target-rows 1000000 --disable-ann --warm-runs 0 --work-dir /tmp/issue162-flat --output /tmp/issue162-flat.json
          python scripts/benchmark_issue_162.py --source-rows 1000 --target-rows 1000000 --warm-runs 0 --work-dir /tmp/issue162-ann --output /tmp/issue162-ann.json
      - name: Real-world matching quality (scan baseline)
        run: python scripts/evaluate_matching_quality.py
      - name: Real-world field score diagnostics
        run: python scripts/diagnose_matching_scores.py
      - run: python -m compileall -q src
      - run: bash -n installer/install.sh
      - run: python scripts/check_repo_files.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build
