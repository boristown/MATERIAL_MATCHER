name: ci

on:
  pull_request:
  push:
    branches:
      - 'feat/**'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Real-world matching quality (scan baseline)
        run: python scripts/evaluate_matching_quality.py
      - name: Real-world field score diagnostics
        run: python scripts/diagnose_matching_scores.py
      - run: python -m compileall -q src
      - name: Shell syntax checks
        run: bash -n installer/install.sh installer/install_wizard.sh installer/启动安装.sh tools/mmctl.sh tools/rebuild_frontend.sh tools/维护工具.sh
      - name: Docker Compose source validation
        run: MM_ADMIN_PASSWORD=TestAdmin123 docker compose -f docker/compose.yaml config >/dev/null
      - run: python scripts/check_repo_files.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build
